name: CI SpGen RS

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "tools/spgen-rs/**"
      - ".github/workflows/ci_spgen_rs.yml"
  pull_request:
    paths:
      - "tools/spgen-rs/**"
      - ".github/workflows/ci_spgen_rs.yml"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  CI:
    name: CI
    runs-on: ubuntu-latest
    timeout-minutes: 20

    defaults:
      run:
        working-directory: tools/spgen-rs

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Restore cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: tools/spgen-rs

      - name: Check formatting
        run: cargo fmt --check

      - name: Clippy
        run: cargo clippy --all-targets -- -D warnings

      - name: Run tests
        run: cargo test
