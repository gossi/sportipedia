name: CI Frontend

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/workflows/ci_frontend.yml"
      - "services/auth"
      - "apps/**"
      - "packages/**"
      - "support/**"
      - ".node-version"
      - "package.json"
      - "pnpm-workspace.yaml"
  pull_request:
    paths:
      - ".github/workflows/ci_frontend.yml"
      - "services/auth"
      - "apps/**"
      - "packages/**"
      - "support/**"
      - ".node-version"
      - "package.json"
      - "pnpm-workspace.yaml"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint-js:
    name: lint:js
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Setup
        uses: ./.github/actions/setup
      - run: pnpm run -r --parallel --aggregate-output lint:js

  lint-css:
    name: lint:css
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Setup
        uses: ./.github/actions/setup
      - run: pnpm run -r --parallel --aggregate-output lint:css

  lint-hbs:
    name: lint:hbs
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Setup
        uses: ./.github/actions/setup
      - run: pnpm run -r --parallel --aggregate-output lint:hbs

  lint-types:
    name: lint:types
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Setup
        uses: ./.github/actions/setup
      - run: pnpm run -r --parallel --aggregate-output lint:types


  playwright_version:
    name: playwright version
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.read.outputs.version }}
    steps:
      - uses: actions/checkout@v6
      - id: read
        run: |
          version=$(grep -E '^[[:space:]]+playwright:' pnpm-workspace.yaml | head -n 1 | sed -E 's/.*"([^"]+)".*/\1/')
          echo "version=$version" >> "$GITHUB_OUTPUT"

  test:
    name: test
    runs-on: ubuntu-latest
    needs: playwright_version
    container:
      # Make sure to grab the latest version of the Playwright image
      # https://playwright.dev/docs/docker#pull-the-image
      image: mcr.microsoft.com/playwright:v${{ needs.playwright_version.outputs.version }}-noble
    steps:
      - uses: actions/checkout@v6
      - name: Setup
        uses: ./.github/actions/setup
      - run: pnpm  --dir apps/catalog run apidoc
      - run: pnpm run -r --parallel --aggregate-output test
