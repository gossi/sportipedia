name: CI SpArch

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "tools/sparch/**"
      - ".github/workflows/ci_sparch.yml"
  pull_request:
    paths:
      - "tools/sparch/**"
      - ".github/workflows/ci_sparch.yml"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  CI:
    name: CI
    runs-on: ubuntu-latest
    timeout-minutes: 20

    defaults:
      run:
        working-directory: tools/sparch

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Restore cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: tools/sparch

      - name: Check formatting
        run: cargo fmt --check

      - name: Clippy
        run: cargo clippy --all-targets -- -D warnings

      - name: Run tests
        run: cargo test

  binding:
    name: Elixir binding
    runs-on: ubuntu-latest
    timeout-minutes: 10

    defaults:
      run:
        working-directory: tools/sparch/elixir

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Erlang/OTP and Elixir
        uses: erlef/setup-elixir@v1
        with:
          version-file: .tool-versions
          version-type: strict

      - name: Check formatting
        run: mix format --check-formatted

      - name: Compile
        run: mix compile --warnings-as-errors
