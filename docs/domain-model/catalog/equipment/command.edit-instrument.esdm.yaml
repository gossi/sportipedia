apiVersion: schema.esdm.io/core/v1
kind: command
name: edit-instrument
scope:
  domain: sport
  boundedContext: sport
  aggregate: instrument
data:
  type: object
  properties:
    title:
      type: string
      description: "Name of the instrument"
    slug:
      type: string
      description: "URL-friendly unique identifier"
    description:
      type: string
      description: "Optional description"
constraints:
  - name: instrument-exists
    rule: An instrument needs to exist (check by id)
  - name: slug-change-is-collision-free
    rule: When the slug is changed, no two positions bound to equipment may end up sharing the same canonical slug
  - name: valid-slug
    rule: "The slug is well-formed: lower-case letters, digits and dashes, starting with a letter or digit"
publishes:
  - instrument-edited
actors:
  - user
