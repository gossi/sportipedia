apiVersion: schema.esdm.io/core/v1
kind: command
name: catalog-apparatus
scope:
  domain: sport
  boundedContext: sport
  aggregate: apparatus
data:
  type: object
  properties:
    title:
      type: string
      description: "Name of the apparatus"
    slug:
      type: string
      description: "URL-friendly unique identifier"
    description:
      type: string
      description: "Optional description"
  required:
    - title
    - slug
constraints:
  - name: valid-slug
    rule: "The slug is well-formed: lower-case letters, digits and dashes, starting with a letter or digit"
publishes:
  - apparatus-cataloged
actors:
  - user
