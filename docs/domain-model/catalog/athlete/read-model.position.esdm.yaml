apiVersion: schema.esdm.io/core/v1
kind: read-model
name: position
scope:
  domain: sport
  boundedContext: sport
projections:
  - boundedContext: sport
    aggregate: position
    event: position-cataloged
    rule: "Project the position when it is cataloged"
  - boundedContext: sport
    aggregate: position
    event: position-edited
    rule: "Update position details"
  - boundedContext: sport
    aggregate: position
    event: position-archived
    rule: "Mark position as archived"
schema:
  type: object
  properties:
    id:
      type: string
      format: uuid
      description: "Unique identifier"
    title:
      type: string
      description: "Name of the position"
    slug:
      type: string
      description: "URL-friendly unique identifier"
    description:
      type: string
      description: "Optional description"
    apparatusId:
      type: string
      format: uuid
      description: "Reference to apparatus (optional)"
    instrumentId:
      type: string
      format: uuid
      description: "Reference to instrument (optional)"
    archivedAt:
      type: string
      format: date-time
      description: "Timestamp when archived (null if active)"
  required:
    - id
    - title
    - slug
