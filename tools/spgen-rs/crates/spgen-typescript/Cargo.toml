[package]
name = "spgen-typescript"
version.workspace = true
edition.workspace = true

[[bin]]
name = "spgen-typescript"
path = "src/main.rs"

[dependencies]
spgen-model = { path = "../spgen-model" }

oxc_allocator = "=0.158.0"
oxc_ast = "=0.158.0"
oxc_parser = "=0.158.0"
oxc_span = "=0.158.0"
clap = { version = "4.6.7", features = ["derive"] }
