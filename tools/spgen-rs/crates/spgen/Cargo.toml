[package]
name = "spgen"
version.workspace = true
edition.workspace = true

[[bin]]
name = "spgen"
path = "src/main.rs"

[dependencies]
spgen-model = { path = "../spgen-model" }
spgen-elixir = { path = "../spgen-elixir" }
spgen-typescript = { path = "../spgen-typescript" }

serde = { version = "1", features = ["derive"] }
serde_json = "1"
clap = { version = "4.6.7", features = ["derive", "string"] }
clap_mangen = "0.3.4"
roff = "1.1.1"
pulldown-cmark = "0.13.6"
