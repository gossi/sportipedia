[package]
name = "spgen-elixir"
version.workspace = true
edition.workspace = true

[[bin]]
name = "spgen-elixir"
path = "src/main.rs"

[dependencies]
spgen-model = { path = "../spgen-model" }

tree-sitter = "0.25"
tree-sitter-elixir = "0.3"

serde_json = "1"
clap = { version = "4.6.7", features = ["derive"] }
