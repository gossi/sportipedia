[package]
name = "sparch-elixir"
version.workspace = true
edition.workspace = true

[[bin]]
name = "sparch-elixir"
path = "src/main.rs"

[dependencies]
sparch-model = { path = "../sparch-model" }

tree-sitter = "0.25"
tree-sitter-elixir = "0.3"

serde_json = "1"
clap = { version = "4.6.7", features = ["derive"] }
