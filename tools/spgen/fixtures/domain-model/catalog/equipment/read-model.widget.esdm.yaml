apiVersion: schema.esdm.io/core/v1
kind: read-model
name: widget
description: "A cataloged widget, projected from the widget aggregate"
metadata:
  annotations:
    spgen.operation.widget-created: create
    spgen.operation.widget-edited: update
    spgen.operation.widget-archived: delete
    spgen.operation.widget-relabelled: update
    # an audit fact: the decision is deliberately "nothing materializes"
    spgen.operation.widget-rename-logged: none
    spgen.operation.widget-noted: none
scope:
  domain: sport
  boundedContext: sport
projections:
  - boundedContext: sport
    aggregate: widget
    event: widget-created
    rule: "Project the widget when it is created"
  - boundedContext: sport
    aggregate: widget
    event: widget-edited
    rule: "Update the widget details"
  - boundedContext: sport
    aggregate: widget
    event: widget-archived
    rule: "Delete the widget"
  - boundedContext: sport
    aggregate: widget
    event: widget-relabelled
    rule: "Update the widget label"
schema:
  type: object
  properties:
    id:
      type: string
      format: uuid
      description: "Unique identifier"
    title:
      type: string
      description: "Name of the widget"
    slug:
      type: string
      description: "URL-friendly unique identifier"
    label:
      type: string
      description: "Short label shown in lists"
    description:
      type: string
      description: "Optional description"
    archivedAt:
      type: string
      format: date-time
      description: "When the widget was archived"
    coachId:
      type: string
      format: uuid
      description: "Reference to the owning coach"
    teamId:
      type: string
      format: uuid
      description: "Reference to the owning team"
  required:
    - id
    - title
    - slug
  examples:
    - id: "equipment:widget:classic-widget"
      title: "Classic Widget"
      slug: "classic-widget"
      label: "classic"
      description: "The original widget of the fixture world"
      coachId: "equipment:coach:head-coach"
      teamId: "equipment:team:first-team"
    - id: "equipment:widget:gadget-2000"
      title: "Gadget 2000"
      slug: "gadget-2000"
      description: "A newer widget, unlabeled and unassigned"
