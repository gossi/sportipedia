apiVersion: schema.esdm.io/core/v1
kind: query
name: read-widget
description: "Retrieve a single widget by its id or slug"
scope:
  domain: sport
  boundedContext: sport
readModel: widget
result:
  type: object
  properties:
    id:
      type: string
      format: uuid
      description: "Unique identifier"
    title:
      type: string
      description: "Name of the widget"
    slug:
      type: string
      description: "URL-friendly unique identifier"
    label:
      type: string
      description: "Short label shown in lists"
  required:
    - id
    - title
    - slug
parameters:
  oneOf:
    - type: object
      properties:
        id:
          type: string
          format: uuid
          description: "Unique identifier of the widget"
      required:
        - id
    - type: object
      properties:
        slug:
          type: string
          description: "URL-friendly slug of the widget"
      required:
        - slug
actors:
  - guest
  - user
