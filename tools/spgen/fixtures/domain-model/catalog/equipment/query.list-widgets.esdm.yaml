apiVersion: schema.esdm.io/core/v1
kind: query
name: list-widgets
description: "List all widgets with filtering, sorting, and pagination"
scope:
  domain: sport
  boundedContext: sport
readModel: widget
result:
  type: array
  items:
    type: object
    properties:
      id:
        type: string
        format: uuid
        description: "Unique identifier"
      title:
        type: string
        description: "Name of the widget"
      slug:
        type: string
        description: "URL-friendly unique identifier"
      label:
        type: string
        description: "Short label shown in lists"
    required:
      - id
      - title
      - slug
parameters:
  type: object
  properties:
    filter:
      type: object
      properties:
        title:
          type: string
          description: "Filter widgets by title (partial match)"
    sort:
      type: string
      description: "Sort field(s) following JSON:API sort syntax"
    page:
      type: object
      description: "Pagination following JSON:API pagination"
actors:
  - guest
  - user
constraints:
  - name: filter-by-title
    rule: "Filter widgets whose title contains the given string (case-insensitive partial match)"
  - name: sort-by-fields
    rule: "Sort results by one or more fields following JSON:API sort syntax"
